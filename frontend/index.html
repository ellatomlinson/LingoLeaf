<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono&family=Sen:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
  </head>
  <body>
    <img class="leaves1" src="assets/leaves.png" />
    <img class="leaves2" src="assets/leaves.png" />
    <img class="leaves3" src="assets/leaves.png" />
    <img class="leaves4" src="assets/leaves.png" />
    <img class="leaves5" src="assets/leaves.png" />
    <div class="logo-container">
      <img src="assets/logo.png" alt="Logo" class="logo" />
    </div>
    <div class="page-content">
      <div class="input-field">
        <div class="input-group">
          <div class="circle-stack">
            <button class="play-button" id="play-button">
              <i class="fa fa-play"></i>
            </button>
            <div class="score-circle" id="score">-</div>
          </div>
          <div class="texts_container">
            <textarea
              id="prac-phrase"
              class="input"
              type="text"
              placeholder="Enter a practice phrase, or press 'random' to have one generated"
            ></textarea>
            <div id="word-scores-container"></div>
          </div>
        </div>
      </div>
      <div class="random-button-container">
        <button class="random-button">Random</button>
      </div>
      <button class="record-button">
        <i id="record-icon" class="fa fa-microphone"></i>
      </button>
    </div>
  </body>

  <script>
    let isRecording = false
    const recordIcon = document.getElementById('record-icon')
    const container = document.getElementById('word-scores-container')

    const recordButton = document.querySelector('.record-button')
    document
      .querySelector('.random-button')
      .addEventListener('click', async () => {
        const phrase = await window.api.getRandomPhrase()
        document.getElementById('prac-phrase').value = phrase
        container.innerHTML = ''
      })
    document.getElementById('play-button').addEventListener('click', () => {
      const phrase = document.getElementById('prac-phrase').value
      if (phrase) {
        window.api.speakText(phrase)
      }
    })
    recordButton.addEventListener('click', async () => {
      if (!isRecording) {
        isRecording = true
        recordButton.classList.add('recording')
        recordIcon.classList.remove('fa-microphone')
        recordIcon.classList.add('fa-stop')
        await window.api.startRecording()
      } else {
        isRecording = false
        recordButton.classList.remove('recording')
        recordIcon.classList.remove('fa-stop')
        recordIcon.classList.add('fa-microphone')

        // A wait spinner while we process the audio
        const scoreCircle = document.getElementById('score')
        scoreCircle.innerHTML = '<i class="fa fa-spinner fa-spin"></i>'

        const target = document.getElementById('prac-phrase').value
        const result = await window.api.stopAndProcessRecording(target)

        container.innerHTML = ''

        const wordScores = result.word_scores
        const spokenWords = result.spoken_words

        // Build each word with tooltip for the score
        spokenWords.forEach((word, index) => {
          const wordSpan = document.createElement('span')
          wordSpan.className = 'word-tooltip'
          wordSpan.textContent = word + ' '

          const tooltipSpan = document.createElement('span')
          tooltipSpan.className = 'tooltiptext'
          tooltipSpan.textContent = `${Math.round(wordScores[index] * 100)}%`

          // Change word colour according to score
          if (wordScores[index] > 0.8) {
            wordSpan.style.color = '#40535C'
          } else if (wordScores[index] > 0.6) {
            wordSpan.style.color = '#C5871B'
          } else {
            wordSpan.style.color = '#770404'
          }

          wordSpan.appendChild(tooltipSpan)
          container.appendChild(wordSpan)
        })

        // Update the overall score too
        scoreCircle.textContent = `${Math.round(result.overall_score * 100)}%`
      }
    })
  </script>
</html>
